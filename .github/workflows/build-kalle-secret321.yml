name: Kalle Chaosbuddy 3.2.1 – Easter Eggs ohne Spracheingabe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kalle-secret321.yml'
      - '.github/patches/321/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Kalle 3.2.1 – separate Android-Test-APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 3.1.0-Basis entpacken
        shell: bash
        run: |
          set -euo pipefail
          test -s Kalle-Chaosbuddy-3.1.0-CI-Source.zip
          unzip -q Kalle-Chaosbuddy-3.1.0-CI-Source.zip -d _source
          test -s _source/Kalle-Chaosbuddy-3.1.0/settings.gradle

      - name: Ruhige Widget-Szenen und Easter Eggs anwenden
        shell: bash
        working-directory: _source
        run: |
          set -euo pipefail
          python3 ../.github/scripts/apply-kalle-311-calm-scenes.py
          python3 ../.github/patches/321/apply-secret-edition.py
          cp ../.github/patches/321/EasterEggs.java Kalle-Chaosbuddy-3.1.0/app/src/main/java/de/boyka/kallebuddy/EasterEggs.java
          echo "No voice integration:"
          ! grep -R -n -E 'RecognizerIntent|ACTION_RECOGNIZE_SPEECH|MISSION DIKTIEREN|android.permission.RECORD_AUDIO' Kalle-Chaosbuddy-3.1.0/app/src/main
          echo "Easter egg count:"
          grep -c '"sechs", "nervensaege"' Kalle-Chaosbuddy-3.1.0/app/src/main/java/de/boyka/kallebuddy/EasterEggs.java

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Android Debug APK kompilieren
        shell: bash
        working-directory: _source/Kalle-Chaosbuddy-3.1.0
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Paketname und Signatur validieren
        shell: bash
        working-directory: _source/Kalle-Chaosbuddy-3.1.0
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/kalle321-badging.txt
          grep -F "package: name='de.boyka.kallebuddy.test321' versionCode='30201'" /tmp/kalle321-badging.txt
          grep -F "application-label:'Kalle 3.2.1 Geheimnisse'" /tmp/kalle321-badging.txt
          mkdir -p dist
          cp "$apk" dist/Kalle-Chaosbuddy-3.2.1-EASTER-EGGS-TEST.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Kalle-Chaosbuddy-3.2.1-EASTER-EGGS-APK
          path: _source/Kalle-Chaosbuddy-3.1.0/dist/
          retention-days: 14
          if-no-files-found: error

      - name: Teststatus
        if: always()
        run: |
          echo 'Separates Debug-Paket test321. Signiersicherung wurde NICHT verwendet oder hochgeladen.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Keine Spracheingabe. 15 versteckte, einmalige Geheimnisse und Sammelbuch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Der bekannte Bestand von 4 fehlschlagenden Unit-Tests wird durch einen erfolgreichen Build nicht als behoben behauptet.' >> "$GITHUB_STEP_SUMMARY"
